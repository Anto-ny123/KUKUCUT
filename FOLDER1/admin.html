<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kuku Cut Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">

<body class="bg-gray-100">

<div class="flex h-screen">

    <!-- SIDEBAR -->
    <div class="w-64 bg-gray-900 text-white flex flex-col p-5">
        <h2 class="text-2xl font-bold mb-8 text-red-500">Kuku Cut</h2>

        <button onclick="showSection('dashboard')" class="mb-4 text-left hover:text-red-400">Dashboard</button>
        <button onclick="showSection('orders')" class="mb-4 text-left hover:text-red-400">Orders</button>
        <button onclick="showSection('messages')" class="mb-4 text-left hover:text-red-400">Messages</button>

        <button onclick="logout()" class="mt-auto bg-red-600 px-4 py-2 rounded hover:bg-red-700">
            Logout
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="flex-1 p-6 overflow-y-auto">

        <!-- DASHBOARD -->
        <div id="dashboardSection">
            <h1 class="text-3xl font-bold mb-6">Dashboard</h1>

            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 class="text-gray-500 text-sm">Total Revenue</h3>
                    <p id="totalRevenue" class="text-2xl font-bold text-green-600">KSh 0</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 class="text-gray-500 text-sm">Orders Today</h3>
                    <p id="ordersToday" class="text-2xl font-bold text-blue-600">0</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow">
                    <h3 class="text-gray-500 text-sm">Top Product</h3>
                    <p id="topProduct" class="text-2xl font-bold text-red-600">None</p>
                </div>
            </div>
        <div class="bg-white p-6 rounded-xl shadow mt-6">
            <h3 class="text-lg font-bold mb-4">Sales Overview</h3>
            <canvas id="salesChart"></canvas>
         </div>
        </div>

        <!-- ORDERS -->
        <div id="ordersSection" class="hidden">
            <h1 class="text-2xl font-bold mb-4">Orders</h1>

            <div class="bg-white shadow rounded-xl overflow-x-auto">
                <table class="w-full min-w-[1000px]">
    <thead class="bg-red-600 text-white">
    <tr>

        <th class="p-3 text-left">
            Order ID
        </th>

        <th class="p-3 text-left">
            Date
        </th>

        <th class="p-3 text-left">
            Products
        </th>

        <th class="p-3 text-left">
            Total
        </th>

        <th class="p-3 text-left">
            Status
        </th>

        <th class="p-3 text-left">
            Action
        </th>

    </tr>
     </thead>
    <tbody id="ordersTable"></tbody>
     </table>
    </div>
    </div>

        <!-- MESSAGES -->
        <div id="messagesSection" class="hidden">
            <h1 class="text-2xl font-bold mb-4">Messages</h1>

            <div class="bg-white rounded-xl shadow p-6">
                <table class="w-full">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="p-3">Name</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Phone</th>
                            <th class="p-3">Message</th>
                            <th class="p-3">Date</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody id="messages-table"></tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
    loadOrders();
    loadMessages();
    loadAnalytics();
    loadChart();
});
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
     }
function getStatusClass(status) {

    switch (status) {

        case 'Pending':
            return 'bg-yellow-100 text-yellow-800';

        case 'Processing':
            return 'bg-blue-100 text-blue-800';

        case 'Completed':
            return 'bg-green-100 text-green-800';

        default:
            return 'bg-gray-100 text-gray-800';
    }
}
async function loadOrders() {

    const table = document.getElementById('ordersTable');

    try {

        const response = await fetch('http://localhost:3000/orders');

        if (!response.ok) {
            throw new Error('Failed to fetch orders');
        }

        const orders = await response.json();

        // No orders
        if (orders.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="p-6 text-center text-gray-500">
                        No orders yet
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML = orders.map((order, index) => {

            // Create the list of products
            const itemsHTML = order.items.map(item => {

                const subtotal =
                    (item.price || 0) * item.quantity;

                return `
                    <div class="mb-3 last:mb-0">

                        <div class="font-semibold text-gray-900">
                            ${item.name}
                        </div>

                        ${
                            item.description
                            ? `
                            <div class="text-xs text-gray-500">
                                ${item.description}
                            </div>
                            `
                            : ''
                        }

                        <div class="text-sm text-gray-600 mt-1">
                            KSh ${(item.price || 0).toLocaleString()}
                            × ${item.quantity}
                            =
                            <span class="font-semibold">
                                KSh ${subtotal.toLocaleString()}
                            </span>
                        </div>

                    </div>
                `;

            }).join('');

            return `

                <tr class="border-b hover:bg-gray-50 align-top">

                    <!-- ORDER ID -->
                    <td class="p-4">

                        <div class="font-semibold text-gray-800">
                            #${order._id.slice(-6).toUpperCase()}
                        </div>

                        <div class="text-xs text-gray-400 mt-1">
                            Order ${index + 1}
                        </div>

                    </td>


                    <!-- DATE -->
                    <td class="p-4">

                        <div class="text-sm text-gray-700">
                            ${order.date}
                        </div>

                    </td>


                    <!-- ITEMS -->
                    <td class="p-4 min-w-[280px]">

                        ${itemsHTML}

                    </td>


                    <!-- TOTAL -->
                    <td class="p-4">

                        <div class="text-lg font-bold text-red-600">
                            KSh ${order.total.toLocaleString()}
                        </div>

                    </td>


    <!-- STATUS -->
    <td class="p-4 min-w-[160px]">

    <div class="relative inline-block">

        <select
            onchange="updateStatus('${order._id}', this.value)"
            class="appearance-none pl-3 pr-8 py-2 rounded-full
                   text-sm font-semibold border-0 cursor-pointer
                   focus:outline-none focus:ring-2 focus:ring-red-400
                   ${getStatusClass(order.status)}">

            <option value="Pending"
                ${order.status === 'Pending' ? 'selected' : ''}>
                🟡 Pending
            </option>

            <option value="Processing"
                ${order.status === 'Processing' ? 'selected' : ''}>
                🔵 Processing
            </option>

            <option value="Completed"
                ${order.status === 'Completed' ? 'selected' : ''}>
                🟢 Completed
            </option>

        </select>

        <!-- Dropdown arrow -->
        <span class="absolute right-3 top-1/2
                     -translate-y-1/2 pointer-events-none
                     text-gray-600">
            ▼
        </span>

    </div>

</td>

    <!-- ACTION -->
<td class="p-4 min-w-[150px]">

    <div class="flex flex-col items-start gap-2">

        <span class="text-xs font-semibold text-gray-500 uppercase">
            Order Actions
        </span>

        <button
            onclick="deleteOrder('${order._id}')"
            class="w-full bg-red-600 hover:bg-red-700
                   text-white px-4 py-2
                   rounded-lg text-sm font-semibold
                   transition duration-200">

            🗑 Delete

        </button>

    </div>

</td>

                </tr>

            `;

        }).join('');

    } catch (error) {

        console.error('Error loading orders:', error);

        table.innerHTML = `
            <tr>
                <td colspan="6"
                    class="p-6 text-center text-red-600">
                    Failed to load orders.
                </td>
            </tr>
        `;
    }
}
function showSection(section) {

    document.getElementById('dashboardSection').classList.add('hidden');
    document.getElementById('ordersSection').classList.add('hidden');
    document.getElementById('messagesSection').classList.add('hidden');

    if (section === 'dashboard') {
        document.getElementById('dashboardSection').classList.remove('hidden');
    }

    if (section === 'orders') {
        document.getElementById('ordersSection').classList.remove('hidden');
        loadOrders();
    }

    if (section === 'messages') {
        document.getElementById('messagesSection').classList.remove('hidden');
        loadMessages();
    }
}
async function deleteOrder(orderId) {

    const confirmed = confirm(
        "Are you sure you want to delete this order?"
    );

    if (!confirmed) {
        return;
    }

    try {

        console.log("Deleting order:", orderId);

        const response = await fetch(
            `http://localhost:3000/orders/${orderId}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        console.log("Delete response:", result);

        if (!response.ok) {
            throw new Error(
                result.message || "Failed to delete order"
            );
        }

        // Reload orders from MongoDB
        await loadOrders();

        // Recalculate analytics from MongoDB
        await loadAnalytics();

        alert("Order deleted successfully.");

    } catch (error) {

        console.error("Error deleting order:", error);

        alert("Failed to delete order: " + error.message);
    }
}
function loadChart() {
    const orders = JSON.parse(localStorage.getItem('kuku_orders')) || [];

    let dailySales = {};

    orders.forEach(order => {
        let date = order.date;

        if (!dailySales[date]) {
            dailySales[date] = 0;
        }

        dailySales[date] += order.total;
    });

    const labels = Object.keys(dailySales);
    const data = Object.values(dailySales);

    const ctx = document.getElementById('salesChart').getContext('2d');

if (window.salesChartInstance) {
    window.salesChartInstance.destroy();
}

window.salesChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Revenue (KSh)',
                data: data,
                borderWidth: 2,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });
}
async function loadAnalytics() {

    try {

        // Get orders from MongoDB through the API
        const response = await fetch('http://localhost:3000/orders');

        if (!response.ok) {
            throw new Error('Failed to fetch orders');
        }

        const orders = await response.json();

        let totalRevenue = 0;
        let todayOrders = 0;
        let productCount = {};

        // Today's date
        const today = new Date().toLocaleDateString();

        orders.forEach(order => {

            // Calculate revenue
            totalRevenue += Number(order.total) || 0;

            // Count today's orders
            if (order.date && order.date.includes(today)) {
                todayOrders++;
            }

            // Count products
            if (order.items && Array.isArray(order.items)) {

                order.items.forEach(item => {

                    if (!productCount[item.name]) {
                        productCount[item.name] = 0;
                    }

                    productCount[item.name] += Number(item.quantity) || 0;

                });
            }

        });

        // Find the most ordered product
        let topProduct = "None";
        let max = 0;

        for (let product in productCount) {

            if (productCount[product] > max) {

                max = productCount[product];
                topProduct = product;

            }

        }

        // Update dashboard
        document.getElementById('totalRevenue').textContent =
            `KSh ${totalRevenue.toLocaleString()}`;

        document.getElementById('ordersToday').textContent =
            todayOrders;

        document.getElementById('topProduct').textContent =
            topProduct;

    } catch (error) {

        console.error("Analytics error:", error);

        document.getElementById('totalRevenue').textContent =
            'KSh 0';

        document.getElementById('ordersToday').textContent =
            '0';

        document.getElementById('topProduct').textContent =
            'None';
    }
}
async function updateStatus(id, newStatus) {

    try {

        const response = await fetch(
            `http://localhost:3000/orders/${id}`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    status: newStatus
                })
            }
        );

        const data = await response.json();

        console.log("Status update response:", data);

        if (!response.ok) {
            throw new Error(
                data.message || 'Failed to update order status'
            );
        }

        console.log("Order status updated successfully");

        // Reload orders from MongoDB
        await loadOrders();

        // Refresh analytics if available
        if (typeof loadAnalytics === 'function') {
            loadAnalytics();
        }

    } catch (error) {

        console.error("Status update error:", error);

        alert("Failed to update order status.");
    }
}
async function loadMessages() {

    const table = document.getElementById('messages-table');

    if (!table) {
        console.error('messages-table was not found');
        return;
    }

    try {

        const response = await fetch('http://localhost:3000/messages');

        if (!response.ok) {
            throw new Error('Failed to fetch messages');
        }

        const messages = await response.json();

        console.log("Messages received:", messages);

        if (messages.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="p-6 text-center text-gray-500">
                        No messages yet
                    </td>
                </tr>
            `;

            return;
        }

        table.innerHTML = messages.map(msg => `

            <tr class="border-b hover:bg-gray-50">

                <!-- NAME -->
                <td class="p-3 font-medium text-gray-900">
                    ${msg.firstName} ${msg.lastName}
                </td>

                <!-- EMAIL -->
                <td class="p-3 text-gray-700">
                    ${msg.email}
                </td>

                <!-- PHONE -->
                <td class="p-3 text-gray-700">
                    ${msg.phone || 'N/A'}
                </td>

                <!-- MESSAGE -->
                <td class="p-3 text-gray-700">
                    ${msg.message}
                </td>

                <!-- DATE -->
                <td class="p-3 text-sm text-gray-500">
                    ${
                        msg.createdAt
                            ? new Date(msg.createdAt).toLocaleString()
                            : (msg.date || 'N/A')
                    }
                </td>

                <!-- ACTION -->
                <td class="p-3">

                    <div class="flex flex-col gap-2">

                        <button
                            onclick="toggleMessageStatus('${msg._id}', '${msg.status || 'Unread'}')"
                            class="px-3 py-2 rounded-lg text-sm font-semibold
                            ${
                                msg.status === 'Read'
                                    ? 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'
                                    : 'bg-green-100 text-green-700 hover:bg-green-200'
                            }">

                            ${
                                msg.status === 'Read'
                                    ? 'Mark Unread'
                                    : 'Mark Read'
                            }

                        </button>

                        <button
                            onclick="deleteMessage('${msg._id}')"
                            class="bg-red-600 hover:bg-red-700
                                   text-white px-3 py-2 rounded-lg
                                   text-sm font-semibold">

                            Delete

                        </button>

                    </div>

                </td>

            </tr>

        `).join('');

    } catch (error) {

        console.error('Error loading messages:', error);

        table.innerHTML = `
            <tr>
                <td colspan="6"
                    class="p-6 text-center text-red-600">
                    Failed to load messages.
                </td>
            </tr>
        `;
    }
}
async function toggleMessageStatus(id, currentStatus) {

    const newStatus =
        currentStatus === 'Read'
            ? 'Unread'
            : 'Read';

    try {

        const response = await fetch(
            `http://localhost:3000/message/${id}/status`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    status: newStatus
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || 'Failed to update message status'
            );
        }

        // Refresh messages
        loadMessages();

    } catch (error) {

        console.error('Status update error:', error);

        alert('Failed to update message status.');
    }
}

async function deleteMessage(id) {

    const confirmed = confirm(
        'Are you sure you want to delete this message?'
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            `http://localhost:3000/message/${id}`,
            {
                method: 'DELETE'
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || 'Failed to delete message'
            );
        }

        // Refresh the table
        loadMessages();

    } catch (error) {

        console.error('Delete message error:', error);

        alert('Failed to delete message.');
    }
}
function logout() {
    localStorage.removeItem("isLoggedIn");
    window.location.href = "login.html";
}

loadMessages();
loadOrders();
</script>

</body>
</html>
